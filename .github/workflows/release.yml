name: Release

# Tagging v* packs the CLI (MinVer derives the version from the tag) and publishes:
#   - NuGet (when NUGET_API_KEY secret is set)
#   - a GitHub Release with the .nupkg attached
# There is no desktop job yet: the Tauri app needs DevContext.Server bundled as a sidecar
# before a downloadable installer works — tracked in GITHUB-READY-START.md (desktop packaging gap).

on:
  push:
    tags: ['v*']

jobs:
  cli:
    name: CLI — pack & publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer walks tag history for the version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build DevContext.slnx --configuration Release

      - name: Test — fast suite
        run: dotnet test DevContext.slnx --configuration Release --no-build --filter "Category!=Eval&Category!=Network"

      - name: Pack CLI
        run: dotnet pack src/DevContext.Cli --configuration Release --no-build -o nupkg

      - name: Push to NuGet
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push nupkg/*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nupkg/*.nupkg

  release:
    name: GitHub Release
    needs: [cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.nupkg
          generate_release_notes: true
