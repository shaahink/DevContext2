name: Release

# Tagging v* publishes:
#   - CLI: MinVer derives the version from the tag; NuGet push (when NUGET_API_KEY is set)
#   - Desktop — WINDOWS-ONLY by decision (Prism D5.4 / H2): Tauri NSIS+MSI installers with
#     DevContext.Server bundled as a sidecar (pnpm publish:server via beforeBuildCommand; users
#     need the .NET 10 runtime). No mac/linux bundles are built: there is no hardware to verify
#     them on — README §Platform support makes the same claim, and tauri.conf.json pins
#     bundle.targets to nsis+msi. Installer version derives from the tag (H3), not the conf
#     default.
#   - a GitHub Release with the .nupkg + installers attached
#
# workflow_dispatch = release DRY-RUN: builds and uploads the full artifact inventory
# (nupkg + Windows installers) so it can be inspected, but skips the NuGet push and the
# GitHub Release — nothing is published from a dispatch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  cli:
    name: CLI — pack & publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer walks tag history for the version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build DevContext.slnx --configuration Release

      - name: Test — fast suite
        run: dotnet test DevContext.slnx --configuration Release --no-build --filter "Category!=Eval&Category!=Network&Category!=McpQa"

      - name: Pack CLI
        run: dotnet pack src/DevContext.Cli --configuration Release --no-build -o nupkg

      - name: Push to NuGet
        if: github.ref_type == 'tag' && env.NUGET_API_KEY != ''
        run: dotnet nuget push nupkg/*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nupkg/*.nupkg

  desktop:
    name: Desktop — Tauri installer (Windows-only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/DevContext.App/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: src/DevContext.App

      # H3 — the installers must carry the release tag's version, not the conf default.
      # A dispatch dry-run has no tag; 0.0.0 marks its artifacts as unpublishable.
      - name: Version installers from the release tag (H3)
        shell: pwsh
        working-directory: src/DevContext.App
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'v0.0.0' }
          node scripts/set-tauri-version.mjs $tag

      # beforeBuildCommand (tauri.conf.json) publishes DevContext.Server into
      # src-tauri/resources/server and builds the Angular frontend before bundling.
      - name: Build installer
        run: pnpm tauri build
        working-directory: src/DevContext.App

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: |
            src/DevContext.App/src-tauri/target/release/bundle/nsis/*.exe
            src/DevContext.App/src-tauri/target/release/bundle/msi/*.msi

  release:
    name: GitHub Release
    needs: [cli, desktop]
    if: github.ref_type == 'tag' # a workflow_dispatch dry-run uploads artifacts but never releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.exe
            artifacts/*.msi
          generate_release_notes: true
