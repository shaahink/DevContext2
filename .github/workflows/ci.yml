name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mirrors the local gate battery (AGENTS.md): Debug build with warnings-as-errors,
  # fast test suite, loom-guards (banned patterns + Category=Truth gate), CLI --strict smoke.
  # eval/gates.ps1 is deliberately NOT here — it clones real repos and stays a local/nightly gate.
  # D5.2 (Prism H1): the engine legs run on all three OSes — the CLI ships to NuGet as a
  # cross-platform net10.0 tool, so build + fast suite + CLI strict smoke must pass off-Windows.
  # loom-guards (Windows PowerShell 5.1 harness) stays on the windows leg; its checks are
  # source-text gates whose verdict is OS-invariant.
  engine:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # eval-repos/* fixtures — truth gates fail on empty fixture dirs

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build (warnings are errors)
        run: dotnet build DevContext.slnx

      # McpQa is excluded: eval/mcp-qa/run.js targets a machine-local dogfood repo (run.js:14)
      # and a live server port — impossible in CI. It runs serially in eval/gates.ps1 locally.
      - name: Test — fast suite
        run: dotnet test DevContext.slnx --no-build --filter "Category!=Eval&Category!=Network&Category!=McpQa"

      - name: Loom guards + truth gate
        if: runner.os == 'Windows'
        run: powershell -File scripts/loom-guards.ps1

      - name: CLI --strict smoke
        run: dotnet run --project src/DevContext.Cli --no-build -- analyze tests/fixtures/MinimalApiProject --strict

  app:
    name: App — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/DevContext.App
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from packageManager in the APP's package.json
        with:
          package_json_file: src/DevContext.App/package.json # no root package.json — the action defaults to repo root and finds nothing

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/DevContext.App/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (lint + test + build)
        run: pnpm check
